<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fc">
  <title>通知カレンダー</title>
  <style>
    :root{font-family:ui-sans-serif,"Yu Gothic UI",Meiryo,system-ui,sans-serif;color:#20253a;background:#f7f8fc;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,textarea{font:inherit}button{cursor:pointer}.app{max-width:1360px;margin:auto;padding:28px 32px 40px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:14px;background:#5a67e8;color:#fff;display:grid;place-items:center;font-size:22px}.brand h1{font-size:20px;margin:0}.brand p{font-size:12px;color:#81869c;margin:3px 0 0}.today{border:1px solid #e3e5ef;background:#fff;border-radius:10px;padding:10px 15px;color:#535a70}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(330px,.9fr);gap:20px}.panel{background:#fff;border:1px solid #e8eaf2;border-radius:16px;box-shadow:0 4px 20px #29305708}.calendar{padding:22px}.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.month-title{font-size:22px;font-weight:700}.nav{display:flex;align-items:center;gap:8px}.nav button,.secondary{border:1px solid #e3e5ef;background:#fff;border-radius:9px;padding:8px 12px;color:#4b5268}.nav .arrow{width:36px;height:36px;padding:0;font-size:19px}.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays div{text-align:center;font-size:12px;color:#8d92a4;padding:10px 0}.weekdays div:first-child{color:#df6674}.weekdays div:last-child{color:#6678dc}.day{border-top:1px solid #eef0f5;min-height:112px;padding:8px 6px;position:relative}.day.muted{background:#fbfbfd;color:#b5b8c5}.date{font-size:12px;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;margin-bottom:6px}.day.today .date{background:#5a67e8;color:white}.day.sun .date{color:#df6674}.day.sat .date{color:#6678dc}.event{font-size:11px;padding:4px 6px;margin:3px 0;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#edf0ff;color:#4c58be}.event.homework{background:#fff1e6;color:#b86824}.event.other{background:#e8f7f1;color:#23805c}.empty{color:#c5c8d2;font-size:10px}.side{display:flex;flex-direction:column;gap:16px}.capture,.upcoming{padding:20px}.section-title{font-size:16px;margin:0 0 6px}.hint{font-size:12px;color:#82879b;line-height:1.65;margin:0 0 14px}.sources{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.tag{font-size:11px;color:#65708a;background:#f1f3f8;border-radius:20px;padding:5px 9px}.capture textarea{width:100%;resize:vertical;min-height:132px;border:1px solid #dfe2ec;border-radius:10px;padding:12px;outline:none;line-height:1.6;font-size:13px}.capture textarea:focus{border-color:#7d87ed;box-shadow:0 0 0 3px #6975e51b}.actions{display:flex;gap:8px;margin-top:10px}.primary{flex:1;border:0;border-radius:9px;background:#5966e7;color:white;padding:10px 14px;font-weight:600}.primary:hover{background:#4955d2}.secondary{font-size:12px}.notice{font-size:11px;color:#8a8fa2;margin:10px 0 0;line-height:1.6}.candidate-list{display:flex;flex-direction:column;gap:8px;margin-top:13px}.candidate{border:1px solid #e8eaf2;border-radius:10px;padding:10px}.candidate strong{font-size:12px}.candidate small{display:block;color:#8b90a2;margin-top:4px}.candidate button{margin-top:8px;border:0;border-radius:7px;background:#edf0ff;color:#505dc4;padding:6px 9px;font-size:11px}.upcoming .section-title{margin-bottom:14px}.up-item{display:flex;gap:11px;padding:10px 0;border-top:1px solid #f0f1f5}.up-date{width:42px;flex:none;text-align:center;color:#5d67d8;font-size:11px}.up-date b{display:block;font-size:18px}.up-desc{min-width:0}.up-desc strong{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.up-desc span{font-size:11px;color:#898ea0}.del{margin-left:auto;border:0;background:none;color:#b0b4c2;font-size:16px;align-self:center}.del:hover{color:#d45b68}.empty-up{font-size:12px;color:#9a9eae}.foot{font-size:11px;color:#a0a4b2;text-align:center;margin-top:18px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#282d43;color:white;padding:10px 16px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
    /* Editorial calendar skin: quiet paper tones, crisp rules, and a restrained green accent. */
    :root{font-family:"Yu Gothic UI",Meiryo,system-ui,sans-serif;color:#222720;background:#f5f4ef;font-synthesis:none}
    body{background:#f5f4ef}
    .app{max-width:1480px;padding:30px 38px 42px}
    .top{margin-bottom:25px;padding-bottom:18px;border-bottom:1px solid #dedfd7}
    .brand{gap:13px}.logo{width:38px;height:38px;border-radius:8px;background:#31594a;color:#f8f7f2;font-size:16px;font-weight:700}
    .brand h1{font-size:18px;letter-spacing:.01em;color:#252a24}.brand p{font-size:11px;color:#82867d;letter-spacing:.03em}
    .today{border:1px solid #cfd3c9;background:transparent;border-radius:6px;padding:9px 14px;color:#355847;font-size:12px;font-weight:600}.today:hover,.secondary:hover{background:#eef0e8}
    .layout{grid-template-columns:minmax(0,1.85fr) minmax(310px,.82fr);gap:24px;align-items:start}
    .panel{background:#fff;border:1px solid #e3e4dc;border-radius:8px;box-shadow:0 2px 8px #343a2510}
    .calendar{padding:22px 24px 16px}.cal-head{margin-bottom:12px}.month-title{font-size:23px;font-weight:650;letter-spacing:-.025em;color:#252a24}
    .nav{gap:5px}.nav button,.secondary{border:1px solid #dedfd8;background:#fff;border-radius:6px;padding:8px 11px;color:#545a51}.nav .arrow{width:34px;height:34px;padding:0;font-size:20px}.nav .arrow:hover{background:#f0f2ed}
    .weekdays div{font-size:11px;font-weight:600;color:#777e74;padding:10px 0;border-bottom:1px solid #dedfd8}.weekdays div:first-child{color:#a36554}.weekdays div:last-child{color:#527b91}
    .day{border-top:0;border-bottom:1px solid #ecece6;border-right:1px solid #ecece6;min-height:112px;padding:8px 7px}.day:nth-child(7n){border-right:0}.day.muted{background:#fbfbf8;color:#bec1b8}.date{font-size:11px;width:24px;height:24px;border-radius:6px;color:#575e55;margin-bottom:5px}.day.today .date{background:#31594a;color:white}.day.sun .date{color:#a36554}.day.sat .date{color:#527b91}
    .event{font-size:10px;padding:4px 6px;margin:3px 0;border-radius:3px;background:#e8efeb;color:#31594a;font-weight:550}.event.homework{background:#f5ece4;color:#965b3c}.event.other{background:#e8efeb;color:#31594a}
    .side{gap:14px}.capture,.upcoming{padding:19px 20px}.section-title{font-size:14px;font-weight:650;letter-spacing:.015em;color:#252a24;margin:0 0 7px}.hint{font-size:11px;color:#787e74;line-height:1.75;margin:0 0 13px}
    .sources{gap:5px;margin-bottom:10px}.tag{font-size:10px;color:#586256;background:#f3f4ef;border-radius:4px;padding:5px 8px}
    .capture textarea{min-height:125px;border:1px solid #d9dcd3;border-radius:6px;padding:11px;background:#fdfdfa;color:#252a24;font-size:12px;line-height:1.7}.capture textarea:focus{border-color:#789687;box-shadow:0 0 0 2px #31594a18}
    .actions{gap:7px;margin-top:9px}.primary{flex:1;border:0;border-radius:6px;background:#31594a;color:#fff;padding:10px 13px;font-size:12px;font-weight:600}.primary:hover{background:#28483b}.secondary{font-size:11px}
    .notice{font-size:10px;color:#898e84;margin:9px 0 0;line-height:1.65}.candidate-list{gap:7px;margin-top:12px}.candidate{border:1px solid #e4e5de;border-radius:6px;padding:10px}.candidate strong{font-size:11px}.candidate small{font-size:11px;color:#777e74;margin-top:4px}.candidate button{border-radius:4px;background:#e8efeb;color:#31594a;padding:6px 9px;font-size:10px}
    .upcoming .section-title{margin-bottom:10px}.up-item{gap:10px;padding:9px 0;border-top:1px solid #ecece6}.up-date{width:40px;color:#557060;font-size:10px}.up-date b{font-size:17px;color:#31594a}.up-desc strong{font-size:11px;color:#353a34}.up-desc span{font-size:10px;color:#858a81}.del{color:#a4a99f}.del:hover{color:#a35444}.empty-up{font-size:11px;color:#898e84}.foot{font-size:10px;color:#989d93;margin-top:13px}.toast{background:#293b31;border-radius:6px;font-size:12px}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.day{min-height:88px}.app{padding:20px 16px}.side{display:grid;grid-template-columns:1fr 1fr}}
    @media(max-width:600px){.app{padding:14px 10px}.side{display:flex}.calendar{padding:12px}.day{min-height:74px;padding:5px 3px}.event{font-size:9px;padding:3px}.empty{display:none}.top{margin-bottom:15px}.today{font-size:11px;padding:8px}.month-title{font-size:19px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><div class="brand"><div class="logo">日</div><div><h1>日々の予定</h1><p>MY CALENDAR&nbsp; / &nbsp;予定と課題</p></div></div><button class="today" id="todayBtn">今日へ</button></header>
    <div class="layout">
      <section class="panel calendar"><div class="cal-head"><div class="month-title" id="monthTitle"></div><div class="nav"><button class="secondary" id="clearBtn">すべて削除</button><button class="arrow" id="prev">‹</button><button class="arrow" id="next">›</button></div></div><div class="weekdays"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div class="days" id="days"></div><div class="foot">入力した予定はこのブラウザー内に保存されます</div></section>
      <aside class="side"><section class="panel capture"><h2 class="section-title">通知文を読み取る</h2><p class="hint">通知の文章を貼り付けると、日付を探して予定候補を作ります。複数の文章は改行で分けてください。</p><div class="sources"><span class="tag">Teams</span><span class="tag">Classroom</span><span class="tag">Gmail</span><span class="tag">Discord</span><span class="tag">その他</span></div><textarea id="input" placeholder="例：数学の課題を11月5日までに提出してください。&#10;例：明日 15:00からグループ発表の打ち合わせ"></textarea><div class="actions"><button class="primary" id="parseBtn">予定候補を作成</button><button class="secondary" id="sampleBtn">例を入力</button></div><p class="notice">候補は内容を確認してから追加できます。通知の自動取得はまだ設定されていません。</p><div id="candidates" class="candidate-list"></div></section><section class="panel upcoming"><h2 class="section-title">登録した予定</h2><div id="upcomingList"></div></section></aside>
    </div>
  </main><div class="toast" id="toast"></div>
  <script>
  (()=>{
    const $=id=>document.getElementById(id), today=new Date(); let cursor=new Date(today.getFullYear(),today.getMonth(),1);
    let items=[]; try{items=JSON.parse(localStorage.getItem('notice-calendar-items')||'[]')}catch{}
    const pad=n=>String(n).padStart(2,'0'), key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const save=()=>localStorage.setItem('notice-calendar-items',JSON.stringify(items));
    function render(){
      $('monthTitle').textContent=`${cursor.getFullYear()}年 ${cursor.getMonth()+1}月`;
      const first=new Date(cursor.getFullYear(),cursor.getMonth(),1), start=new Date(first); start.setDate(1-first.getDay());
      $('days').innerHTML='';
      for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=key(d), cell=document.createElement('div');cell.className='day'+(d.getMonth()!==cursor.getMonth()?' muted':'')+(k===key(today)?' today':'')+(d.getDay()===0?' sun':'')+(d.getDay()===6?' sat':'');
        const date=document.createElement('div');date.className='date';date.textContent=d.getDate();cell.append(date);
        const matches=items.filter(x=>x.date===k).slice(0,3); matches.forEach(x=>{const ev=document.createElement('div');ev.className='event '+(x.type==='課題'?'homework':'other');ev.textContent=x.title;ev.title=x.title;cell.append(ev)});
        if(matches.length===0) {const blank=document.createElement('div');blank.className='empty';blank.textContent='';cell.append(blank)}
        $('days').append(cell);
      }
      renderUpcoming();
    }
    function renderUpcoming(){const list=$('upcomingList');list.innerHTML='';const upcoming=[...items].sort((a,b)=>a.date.localeCompare(b.date)).slice(0,8);if(!upcoming.length){list.innerHTML='<div class="empty-up">通知文から候補を作ると、ここに表示されます。</div>';return}
      upcoming.forEach((x,i)=>{const d=new Date(x.date+'T00:00:00'), row=document.createElement('div');row.className='up-item';const date=document.createElement('div');date.className='up-date';date.innerHTML=`${d.getMonth()+1}月<b>${d.getDate()}</b>`;const desc=document.createElement('div');desc.className='up-desc';const strong=document.createElement('strong');strong.textContent=x.title;const span=document.createElement('span');span.textContent=`${x.type} · ${x.date}`;desc.append(strong,span);const del=document.createElement('button');del.className='del';del.textContent='×';del.title='削除';del.onclick=()=>{items.splice(items.indexOf(x),1);save();render()};row.append(date,desc,del);list.append(row)})}
    function findDate(text){let m=text.match(/(20\d{2})[年\/.\-](\d{1,2})[月\/.\-](\d{1,2})日?/);if(m)return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
      m=text.match(/(\d{1,2})月(\d{1,2})日/);if(m){let year=today.getFullYear();if(+m[1]<today.getMonth()+1-1)year++;return `${year}-${pad(+m[1])}-${pad(+m[2])}`}
      const offsets=[['明後日',2],['あさって',2],['明日',1],['あした',1],['今日',0],['本日',0]];for(const [word,n] of offsets){if(text.includes(word)){const d=new Date(today);d.setDate(d.getDate()+n);return key(d)}}
      m=text.match(/(\d{1,2})\/(\d{1,2})(?!\d)/);if(m)return `${today.getFullYear()}-${pad(+m[1])}-${pad(+m[2])}`;
      const weekdays={'日曜日':0,'日曜':0,'月曜日':1,'月曜':1,'火曜日':2,'火曜':2,'水曜日':3,'水曜':3,'木曜日':4,'木曜':4,'金曜日':5,'金曜':5,'土曜日':6,'土曜':6};for(const [w,n] of Object.entries(weekdays)){if(text.includes(w)){const d=new Date(today),delta=(n-today.getDay()+7)%7||7;d.setDate(d.getDate()+delta);return key(d)}}
      return null;
    }
    function parse(){const lines=$('input').value.split(/[\n。]+/).map(s=>s.trim()).filter(Boolean);const out=[];for(const line of lines){const date=findDate(line);if(!date)continue;const type=/課題|提出|レポート|宿題|締切|期限|までに/.test(line)?'課題':'予定';let title=line.replace(/(20\d{2}[年\/.\-]\d{1,2}[月\/.\-]\d{1,2}日?|\d{1,2}月\d{1,2}日|\d{1,2}\/\d{1,2}|明後日|あさって|明日|あした|今日|本日|日曜日|日曜|月曜日|月曜|火曜日|火曜|水曜日|水曜|木曜日|木曜|金曜日|金曜|土曜日|土曜)/g,'').replace(/[までに期限締切：:]/g,' ').replace(/\s+/g,' ').trim();if(!title)title=line;out.push({date,title,type,source:line})}
      const box=$('candidates');box.innerHTML='';if(!out.length){box.innerHTML='<div class="empty-up">日付が見つかりませんでした。例のように「11月5日」「明日」と書かれた通知を貼ってください。</div>';return}
      out.forEach(c=>{const card=document.createElement('div');card.className='candidate';const title=document.createElement('strong');title.textContent=`${c.date} · ${c.type}`;const desc=document.createElement('small');desc.textContent=c.title;const add=document.createElement('button');add.textContent='カレンダーに追加';add.onclick=()=>{items.push({date:c.date,title:c.title,type:c.type});save();render();card.remove();toast('予定を追加しました')};card.append(title,desc,add);box.append(card)});
    }
    let toastTimer;function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1800)}
    $('prev').onclick=()=>{cursor.setMonth(cursor.getMonth()-1);render()};$('next').onclick=()=>{cursor.setMonth(cursor.getMonth()+1);render()};$('todayBtn').onclick=()=>{cursor=new Date(today.getFullYear(),today.getMonth(),1);render()};$('parseBtn').onclick=parse;$('sampleBtn').onclick=()=>{$('input').value='数学の課題を11月5日までに提出してください。\n明日 15:00からグループ発表の打ち合わせ。';parse()};$('clearBtn').onclick=()=>{if(items.length&&confirm('登録した予定をすべて削除しますか？')){items=[];save();render()}};render();
  })();
  </script>
</body>
</html>
