<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notification Calendar Wallpaper</title>
  <style>
    * { box-sizing: border-box; }
    html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; overflow: hidden; }
    body { background: #0a0e0b; color: #e8eee8; font: 16px "Yu Gothic UI", Meiryo, sans-serif; }
    #calendar { display: none; }
    #offline { position: fixed; inset: 0; display: grid; place-items: center; padding: 32px; background: #0a0e0b; }
    #message { max-width: 560px; padding: 28px 32px; border: 1px solid #334039; background: #151c17; line-height: 1.8; }
    #message strong { display: block; margin-bottom: 10px; color: #65e985; font-size: 22px; }
    #message span { color: #aab5ab; }
  </style>
</head>
<body>
  <iframe id="calendar" title="操作できるローカルカレンダー" src="http://127.0.0.1:43187/?wallpaper=1"></iframe>
  <div id="offline"><div id="message"><strong>NOTIFICATION CALENDAR</strong>デスクトップカレンダーを起動しています…<br><span>デスクトップの「Teams Calendar」ショートカットを起動してください。</span></div></div>
  <script>
    const frame = document.getElementById('calendar');
    const offline = document.getElementById('offline');
    async function connect() {
      try {
        await fetch('http://127.0.0.1:43187/api/calendar', { mode: 'no-cors', cache: 'no-store' });
        offline.style.display = 'none';
        frame.style.display = 'block';
      } catch {
        offline.style.display = 'grid';
        frame.style.display = 'none';
      }
    }
    connect();
    setInterval(connect, 5000);
  </script>
</body>
</html>
