name: Android APK

on:
  push:
    branches: [master, "codex/**"]
    paths:
      - "android-calendar/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: android-calendar
        run: bash ./gradlew --no-daemon :app:assembleDebug
      - name: Publish one installable preview APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/android-notification-listener' && github.run_number == 4
        working-directory: android-calendar
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create android-preview-0.1.0
          app/build/outputs/apk/debug/app-debug.apk
          --prerelease
          --title "Notification Calendar Android 0.1.0 Preview"
          --notes "Personal debug build for installing on the connected Android phone. Notification text stays on the device."
      - uses: actions/upload-artifact@v4
        with:
          name: notification-calendar-android-debug
          path: android-calendar/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
